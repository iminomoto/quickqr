name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also typechecks; fetches the Google fonts used by next/font.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://quickqr.example.com

      # E2E reuses the build output from the previous step (see
      # playwright.config.ts: CI only starts the server).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
