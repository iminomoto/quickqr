services:
  prod:
    build:
      context: .
      target: runner
      # NEXT_PUBLIC_SITE_URL is inlined at build time; compose reads it from
      # the shell or a `.env` file next to this file (see .env.example).
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

  app:
    build:
      context: .
      target: dev
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    ports:
      # Host 3001 so dev and prod can run side by side.
      - "3001:3000"
    volumes:
      - ./src:/app/src
      - ./app:/app/app
    profiles:
      - dev
